<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadra Flow Docs</title> <!-- Final title data.js se set hota hai -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="tailwind.config.js"></script>
</head>
<body data-theme="dark">

    <canvas id="bgCanvas"></canvas>

    <!-- Theme Toggle Button (Bottom Right) -->
    <button id="themeToggleBtn" class="icon-btn theme-btn" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Navbar (content: data.js -> site, libraries) -->
    <nav class="navbar-container" id="navbarRoot"></nav>

    <!-- Docs page: docs.html?lib=<id>  (content: data.js -> libraries[].docs) -->
    <div class="docs-container">
        <aside class="docs-sidebar" id="docsSidebar"></aside>
        <main class="docs-content" id="docsContent"></main>
    </div>

    <!-- Footer (content: data.js -> site.footer) -->
    <footer id="siteFooter"></footer>

    <script src="data.js"></script>
    <script src="render.js"></script>
    <script src="effects.js"></script>
    <script src="script.js"></script>
</body>
</html>
